# Front-end CI (NFR-09): type check, lint and the Jest tests (incl. the sync engine, NFR-08),
# failing under 90% coverage (thresholds in package.json).
name: Front end CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch cancels the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage -- --ci
